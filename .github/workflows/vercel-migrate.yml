name: Vercel project migration
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [provision, retire-portfolio]
        default: provision
      domain:
        type: string
        default: klaud-devops.vn.vercel.app
      expected_commit:
        description: Verified production commit required before retiring portfolio
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: vercel-project-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      OLD_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEW_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      OPERATION: ${{ inputs.operation }}
      DOMAIN: ${{ inputs.domain }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Provision or retire only the identified projects
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const { VERCEL_TOKEN, VERCEL_ORG_ID, OLD_PROJECT_ID, NEW_PROJECT_ID, OPERATION, DOMAIN, EXPECTED_COMMIT } = process.env;
          assert(VERCEL_TOKEN && VERCEL_ORG_ID && OLD_PROJECT_ID, 'Vercel secrets missing');
          assert(/^[a-z0-9.-]+\.vercel\.app$/.test(DOMAIN), 'Invalid requested Vercel hostname');
          async function api(route, method = 'GET', body) {
            const scope = VERCEL_ORG_ID.startsWith('team_') ? `?teamId=${encodeURIComponent(VERCEL_ORG_ID)}` : '';
            const response = await fetch(`https://api.vercel.com${route}${scope}`, { method, signal: AbortSignal.timeout(30000), headers: { Authorization: `Bearer ${VERCEL_TOKEN}`, 'Content-Type': 'application/json' }, ...(body ? { body: JSON.stringify(body) } : {}) });
            const data = response.status === 204 ? {} : await response.json();
            if (!response.ok) throw new Error(`${method} ${route}: ${response.status} ${data.error?.code || ''} ${data.error?.message || ''}`);
            return data;
          }
          const oldProject = await api(`/v9/projects/${OLD_PROJECT_ID}`);
          const oldDomains = await api(`/v9/projects/${OLD_PROJECT_ID}/domains`);
          assert(oldDomains.domains.some(domain => domain.name === 'nguyen-phu-trieu-portfolio.vercel.app'), 'Old project does not own the exact requested portfolio hostname');
          if (OPERATION === 'retire-portfolio') {
            assert(NEW_PROJECT_ID && NEW_PROJECT_ID !== OLD_PROJECT_ID, 'New project must differ from old project');
            assert(/^[a-f0-9]{40}$/.test(EXPECTED_COMMIT), 'Full verified production SHA required');
            const current = await api(`/v9/projects/${NEW_PROJECT_ID}`);
            assert(current.name === 'klaud-devops', 'Unexpected new project');
            const domains = await api(`/v9/projects/${NEW_PROJECT_ID}/domains`);
            assert(domains.domains.some(domain => domain.name === DOMAIN && domain.verified && !domain.redirect), 'New project must own the verified production hostname');
            assert(current.targets?.production?.readyState === 'READY' && current.targets.production.meta?.githubCommitSha === EXPECTED_COMMIT, 'New project production target must match verified commit');
            const health = await fetch(`https://${DOMAIN}/api/health`, { signal: AbortSignal.timeout(30000) });
            assert(health.ok, 'New production health check failed');
            const status = await health.json();
            assert(status.status === 'ok' && status.commit === EXPECTED_COMMIT, 'Production does not match verified Git commit');
            await api(`/v9/projects/${OLD_PROJECT_ID}`, 'DELETE');
            writeFileSync('migration-report.json', JSON.stringify({ retiredProject: oldProject.name, retiredDomain: 'nguyen-phu-trieu-portfolio.vercel.app', verifiedCommit: status.commit, domain: DOMAIN }));
            console.log(`Retired ${oldProject.name}; new production verified at ${DOMAIN}`);
          } else {
            const list = await api('/v9/projects');
            let project = list.projects.find(project => project.name === 'klaud-devops');
            if (!project) project = await api('/v11/projects', 'POST', { name: 'klaud-devops', framework: 'nextjs', nodeVersion: '24.x' });
            const report = { projectId: project.id, projectName: project.name, oldProjectName: oldProject.name, requestedDomain: DOMAIN };
            const domains = await api(`/v9/projects/${project.id}/domains`);
            report.availableDomains = domains.domains.map(domain => domain.name);
            try { const domain = domains.domains.find(domain => domain.name === DOMAIN) || await api(`/v10/projects/${project.id}/domains`, 'POST', { name: DOMAIN }); report.domain = domain.name; report.verified = domain.verified; }
            catch (error) { report.domainError = error.message; }
            writeFileSync('migration-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-report
          path: migration-report.json
          retention-days: 3
